name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Concurrency: cancel stale Security runs on the same workflow+ref so a
# new push to master (or a fresh commit on the same PR) doesn't pile
# another semgrep+gitleaks pass on top of the in-progress one.
# Different workflows on the same ref stay parallel — the workflow
# prefix keeps each workflow's concurrency slot independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install semgrep
      - run: semgrep scan --config p/security-audit --config p/python --config p/typescript
        continue-on-error: true

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
