name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Concurrency: cancel stale Security runs on the same workflow+ref so a
# new push to master (or a fresh commit on the same PR) doesn't pile
# another semgrep+gitleaks pass on top of the in-progress one.
# Different workflows on the same ref stay parallel — the workflow
# prefix keeps each workflow's concurrency slot independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    runs-on: ubuntu-latest
    # Read-only: semgrep scans the checked-out tree and prints to the log.
    # `continue-on-error` keeps it advisory; nothing is written back.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install semgrep
      - run: semgrep scan --config p/security-audit --config p/python --config p/typescript
        continue-on-error: true

  gitleaks:
    runs-on: ubuntu-latest
    # Not read-only, unlike every other job in this repo's CI: gitleaks-action
    # consumes GITHUB_TOKEN to comment on a pull request when it finds a leak
    # (GITLEAKS_ENABLE_COMMENTS defaults to true), which needs
    # `pull-requests: write`. Dropping to `contents: read` would silence that
    # comment on exactly the runs that matter. The SARIF artifact
    # (GITLEAKS_ENABLE_UPLOAD_ARTIFACT) rides the Actions runtime token, not
    # GITHUB_TOKEN, so it needs no scope here.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
