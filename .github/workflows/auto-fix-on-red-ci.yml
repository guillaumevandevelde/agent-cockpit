name: Auto-fix on red CI

on:
  workflow_run:
    workflows: ["Quality"]
    types: [completed]

# Concurrency: a PR that flips red→green→red across multiple commits
# spawns one auto-fix attempt per red. Group by PR number so two PRs
# each get their own attempt in parallel; cancel-in-progress drops a
# previous red run's auto-fix when the next commit also goes red (its
# auto-fix has the freshest branch state anyway). workflow_run.id is
# the last-resort fallback if a run somehow has no PR attached — the
# outer `if:` filters that out, but the expression is defensive.
concurrency:
  group: >-
    auto-fix-${{
      github.event.workflow_run.pull_requests[0].number ||
      github.event.workflow_run.id
    }}
  cancel-in-progress: true

jobs:
  comment-if-first-failure:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Find the PR for this workflow run
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${context.payload.workflow_run.head_branch}`,
              state: 'open',
            });
            if (pulls.length === 0) {
              core.setOutput('number', '');
              return;
            }
            core.setOutput('number', String(pulls[0].number));
            core.setOutput('labels', JSON.stringify(pulls[0].labels.map(l => l.name)));

      - name: Comment and label, once only
        if: steps.pr.outputs.number != '' && !contains(steps.pr.outputs.labels, 'auto-fix-attempted')
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = Number('${{ steps.pr.outputs.number }}');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: '@claude fix the failing checks',
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              labels: ['auto-fix-attempted'],
            });

  # Interim measure, added 2026-08-15. The job above only fires for
  # pull_request-triggered runs, but the direct-mode ship recipe merges to
  # master, which is a `push`. That is why quality.yml stayed red on master
  # from 2026-08-13 to 2026-08-15 with nobody noticing: the safety net covered
  # the route we do not take. A red master has no PR to comment on, so this job
  # raises a single tracking issue instead — deduplicated by label, so a run of
  # reds does not produce a pile of issues.
  #
  # This is deliberately NOT the durable answer. "Something is broken" is the
  # first of the two push cases in cockpit-richting-decision.md §4, and it
  # belongs in the outbound notification channel described there. Remove this
  # job once that channel exists.
  open-issue-on-red-master:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or reuse the red-master tracking issue
        uses: actions/github-script@v9
        with:
          script: |
            const label = 'red-master';
            const runUrl = context.payload.workflow_run.html_url;
            const sha = context.payload.workflow_run.head_sha.slice(0, 8);
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            const body = `Quality failed on master at \`${sha}\`.\n\n${runUrl}`;
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Quality is red on master',
              labels: [label],
              body: `${body}\n\nClose this issue once master is green again.`,
            });
