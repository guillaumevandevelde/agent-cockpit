name: Auto-fix on red CI

on:
  workflow_run:
    workflows: ["Quality"]
    types: [completed]

# Concurrency: a PR that flips red→green→red across multiple commits
# spawns one auto-fix attempt per red. Group by PR number so two PRs
# each get their own attempt in parallel; cancel-in-progress drops a
# previous red run's auto-fix when the next commit also goes red (its
# auto-fix has the freshest branch state anyway). workflow_run.id is
# the last-resort fallback if a run somehow has no PR attached — the
# outer `if:` filters that out, but the expression is defensive.
concurrency:
  group: >-
    auto-fix-${{
      github.event.workflow_run.pull_requests[0].number ||
      github.event.workflow_run.id
    }}
  cancel-in-progress: true

jobs:
  comment-if-first-failure:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Find the PR for this workflow run
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${context.payload.workflow_run.head_branch}`,
              state: 'open',
            });
            if (pulls.length === 0) {
              core.setOutput('number', '');
              return;
            }
            core.setOutput('number', String(pulls[0].number));
            core.setOutput('labels', JSON.stringify(pulls[0].labels.map(l => l.name)));

      - name: Comment and label, once only
        if: steps.pr.outputs.number != '' && !contains(steps.pr.outputs.labels, 'auto-fix-attempted')
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = Number('${{ steps.pr.outputs.number }}');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: '@claude fix the failing checks',
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              labels: ['auto-fix-attempted'],
            });

  # Durable answer for "something is broken" (cockpit-richting-decision.md §4,
  # second push case). The previous interim measure opened a `red-master`
  # tracking issue; that is replaced here by a Telegram push to the owner's
  # chat. Secrets are configured per repo (Settings → Secrets and variables →
  # Actions): TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID. Without both secrets the
  # step is a no-op so a bot-less fork still runs the workflow.
  notify-on-red-master:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    steps:
      - name: Push red-master notification to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          short_sha="${SHA:0:8}"
          text="Quality failed on master at \`${short_sha}\`. ${RUN_URL}"
          curl -fsS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" \
            --data-urlencode "parse_mode=Markdown"
