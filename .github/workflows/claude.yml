name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# Concurrency: @claude mentions on different issues/PRs must run in
# parallel — group on the issue or PR number, NOT on github.ref (which
# would serialize every @claude mention in the repo behind the first).
# cancel-in-progress: false — cancelling a Claude session mid-flight
# on the same issue loses in-progress reasoning; a subsequent comment
# on the same issue gets a fresh session that sees the previous
# session's comments via the issue thread anyway. Multiple comments on
# the SAME issue/PR still serialize because they share the same group
# key (issue_comment and pull_request_review_comment both expose
# issue.number, where PRs surface as issue numbers in GitHub's data
# model). pull_request_review events lack an `issue` field, so the
# fallback to `pull_request.number` covers them; `run_id` is the
# last-resort uniqueness guard if both are absent (defensive — every
# event type listed above exposes at least one).
concurrency:
  group: >-
    claude-${{
      github.event.issue.number ||
      github.event.pull_request.number ||
      github.run_id
    }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr:*)'

