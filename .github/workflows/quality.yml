name: Quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Backend lint and backend tests are deliberately SEPARATE jobs.
#
# They used to be one sequential job with `pytest -q` as the last step, so any
# earlier failure skipped it — GitHub stops a job at the first failed step. Two
# stray F541s kept `pytest` from running on master for five days (last green
# 2026-07-31, 40 consecutive red runs) while every ship claimed a backend gate
# that had never executed. The breakage was also layered: fixing ruff only
# revealed a stale OpenAPI snapshot behind it, which in turn had been hiding 22
# real test failures.
#
# Two independent mechanisms keep that from recurring:
#   1. lint and tests are separate jobs, so a cosmetic lint hit can never
#      suppress the test result (or the reverse);
#   2. inside backend-lint each gate carries `if: ${{ !cancelled() }}`, so one
#      run reports EVERY failing gate instead of only the first. Without this a
#      red ruff step still hides the OpenAPI verdict — exactly how the layering
#      above stayed invisible.
jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      # `id` is load-bearing: every gate below keys its `if:` off this step's
      # outcome. Without that guard a failed install would make all of them run
      # and fail with "command not found", burying the real cause in noise.
      - id: deps
        run: pip install -r requirements-dev.txt
        working-directory: backend

      # Each gate runs whenever deps installed, regardless of how the previous
      # gate went — that is what makes one run report ALL failing gates.
      - run: ruff check app tests
        working-directory: backend
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
      - run: mypy app --ignore-missing-imports
        working-directory: backend
        continue-on-error: true
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
      - run: bandit -r app -lll
        working-directory: backend
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
      - run: bandit -r app -f txt
        working-directory: backend
        continue-on-error: true
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
      - run: python scripts/check_openapi_snapshot.py
        working-directory: backend
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
      - name: Superpowers promotion ledger (advisory)
        run: bash scripts/check-superpowers-promotions.sh
        continue-on-error: true
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
      # Six statische check-scripts advisory gewired (kanban card d92f6f5f…).
      # Vorm spiegelt check-superpowers-promotions.sh hierboven: draaien vanuit
      # repo-root, advisory (`continue-on-error: true`), en dezelfde `if:`-vorm
      # zodat één run alle falende gates toont.
      - name: Worktree admin files tracked (advisory)
        run: bash scripts/check-worktree-admin-files.sh
        continue-on-error: true
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
      - name: Dispatch resolver usage (advisory)
        run: bash scripts/check-dispatch-resolver-usage.sh
        continue-on-error: true
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
      - name: Schema rename coverage (advisory)
        run: bash scripts/check-schema-rename-coverage.sh
        continue-on-error: true
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
      - name: Test harness coverage (advisory)
        run: bash scripts/check-test-harness-coverage.sh
        continue-on-error: true
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
      - name: Doc readability (advisory)
        run: python3 scripts/check-doc-readability.py
        continue-on-error: true
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
      - name: CI health (advisory)
        run: bash scripts/check-ci-health.sh
        continue-on-error: true
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: pytest -q
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run test:coverage
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  e2e:
    runs-on: ubuntu-latest
    # Gated on the jobs that say whether the app actually works, NOT on
    # backend-lint: import ordering has no bearing on whether the stack boots,
    # and gating on it would let a cosmetic hit silently skip e2e — the same
    # failure mode this split exists to remove.
    needs: [backend-tests, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start backend
        run: |
          nohup uvicorn app.main:app --port 8000 > /tmp/uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            sleep 1
          done
        working-directory: backend
      - run: npm run test:e2e
        working-directory: frontend
    continue-on-error: true
