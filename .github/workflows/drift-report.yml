name: Drift Report

on:
  schedule:
    - cron: '0 7 * * 1'  # Monday 7am UTC
  workflow_dispatch: {}

# Concurrency: the drift-report fires on a Monday 7am cron plus manual
# dispatch. Group by workflow+ref so cancel-in-progress drops the
# previous in-progress run when a manual re-trigger arrives during an
# already-running schedule/manual pass. Schedule and dispatch both
# resolve to refs/heads/master in practice, so they share a group —
# the cancel still saves a half-finished pass from completing
# redundantly.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    # Read-only: the job checks out the repo, runs advisory drift scripts, and
    # writes its findings to $GITHUB_STEP_SUMMARY. Writing a step summary needs
    # no token scope at all — it is a file on the runner — so `contents: read`
    # covers everything this job actually does.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend

      - name: Backend coverage
        run: pytest -q --co -q > /tmp/backend_tests.txt; wc -l < /tmp/backend_tests.txt
        working-directory: backend

      - name: Frontend coverage
        run: npm run test:coverage -- --reporter=json --outputFile=/tmp/frontend_coverage.json || true
        working-directory: frontend

      - name: OpenAPI contract check
        id: contract
        run: |
          if python scripts/check_openapi_snapshot.py; then
            echo "status=matches snapshot" >> "$GITHUB_OUTPUT"
          else
            echo "status=DRIFTED — snapshot needs updating" >> "$GITHUB_OUTPUT"
          fi
        working-directory: backend

      - name: TODO/FIXME count
        id: todos
        run: echo "count=$(grep -rEl 'TODO|FIXME' backend/app frontend/src | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Features → docs drift
        id: feature-docs
        # Signal-only: surfaces frontend feature folders without a matching
        # docs/features/<name>.md (or an explicit alias). Never fails the build.
        run: |
          {
            python scripts/check_features_docs.py --repo-root "$GITHUB_WORKSPACE" > /tmp/feature_docs_status 2>&1
            cat /tmp/features_docs_summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          } || true
        working-directory: backend

      - name: Agent role consistency
        id: agent-roles
        # Signal-only: every persona in _IMPEDIMENT_AGENTS /
        # WORK_TYPE_PERSONA_DEFAULTS must match a .claude/agents/*.md entry.
        # Catches vestigial roles (developer/tester/testing/code-review) that
        # the strict test_impediment_agents.py blocks at the backend level.
        run: |
          {
            python scripts/check_agent_roles.py --repo-root "$GITHUB_WORKSPACE" > /tmp/agent_roles_status 2>&1
            cat /tmp/agent_roles_summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          } || true
        working-directory: backend

      - name: CLAUDE.md age vs merges
        id: claude-md-age
        # Signal-only: warns when CLAUDE.md has not been touched in many merge
        # commits on the default branch (threshold: 20 merges).
        run: |
          {
            python scripts/check_claude_md_age.py --repo-root "$GITHUB_WORKSPACE" \
              --file CLAUDE.md --threshold 20 > /tmp/claude_md_age_status 2>&1
            cat /tmp/claude_md_age_summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          } || true
        working-directory: backend

      - name: Spec drift signal (spec-ssot Fase 2)
        id: spec-drift
        # Signal-only: flags Done cards with `metadata.spec_doc` whose closing
        # merge touched `backend/app/` or `frontend/src/features/` without
        # touching the linked spec-doc. Outputs a markdown summary; the
        # `[spec-update]` backlog-card filing is a separate, human-triggered
        # step (file_spec_drift_cards.py) because the workflow has no kanban
        # credentials.
        run: |
          {
            python scripts/check_spec_drift.py \
              --repo-root "$GITHUB_WORKSPACE" \
              --project-key "git:github.com/${GITHUB_REPOSITORY#*/}" \
              --kanban-base "http://localhost:8000/api/v1/kanban" \
              > /tmp/spec_drift_status 2>&1
            cat /tmp/spec_drift_summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          } || true
        working-directory: backend

      - name: Decision register drift (incl. headers)
        id: decision-register
        # Signal-only: surfaces docs/cockpit/*-decision.md not linked from
        # the canonical register (decisions.md) AND, via --check-headers,
        # docs whose four-field header (Datum/Status/Kaart/Uitkomst) is
        # missing or disagrees with the register row. Advisory by design;
        # the script exits 0 unless --strict is added.
        # (kanban card fce4b010… — was unwired before; drifted headers
        # landed on master around 9ad6f8f1 and stayed hidden until a prose
        # session stumbled on them.)
        run: |
          {
            bash scripts/check-decision-register.sh --check-headers \
              > /tmp/decision_register_status 2>&1
          } || true

      - name: Doc frontmatter drift
        id: doc-frontmatter
        # Signal-only: surfaces docs/cockpit/*.md missing the OKF
        # frontmatter backbone (title + type + status) or carrying
        # unknown type/status values. Advisory by design.
        run: |
          {
            bash scripts/check-doc-frontmatter.sh \
              > /tmp/doc_frontmatter_status 2>&1
          } || true

      - name: Decision doc anchor drift
        id: decision-doc-anchors
        # Signal-only: surfaces docs/cockpit/*-decision.md that make claims
        # about Cockpit code without backing them with a
        # `backend/app|frontend/src|backend/tests:<line>` anchor (with or
        # without surrounding backticks). Kaart 1bf9b52d… — the keep-row of
        # `cc-native-cross-session-decision.md` (2026-08-10) rested on a
        # kanban_ops-coupling that grep disproves in seconds; the doc had
        # no anchor, so the false claim stood for three days. Advisory by
        # design; mirrors the other doc-checks.
        run: |
          {
            bash scripts/check-decision-doc-anchors.sh \
              > /tmp/decision_doc_anchors_status 2>&1
          } || true

      - name: Doc broken-link drift
        id: doc-links
        # Signal-only: surfaces relative Markdown links inside
        # docs/cockpit/*.md, .claude/skills/**/*.md, and
        # .claude/agents/*.md that don't resolve to an existing file.
        # Pure anchors, absolute paths, and URI schemes are skipped.
        # Advisory by design.
        run: |
          {
            bash scripts/check-doc-links.sh \
              > /tmp/doc_links_status 2>&1
          } || true

      - name: Generated doc-index drift
        id: doc-index
        # Signal-only: surfaces docs/cockpit/README.md (generated block)
        # or docs/cockpit/llms.txt that hasn't been regenerated from the
        # frontmatter backbone. --strict makes the script exit 1 on drift
        # so the step turns yellow; the outer `|| true` keeps the overall
        # workflow green so this stays an advisory signal, not a gate.
        run: |
          {
            python scripts/generate-doc-index.py --check --strict \
              > /tmp/doc_index_status 2>&1
          } || true

      - name: Write summary
        run: |
          {
            echo "## Weekly drift report"
            echo ""
            echo "- OpenAPI contract: ${{ steps.contract.outputs.status }}"
            echo "- Files containing TODO/FIXME: ${{ steps.todos.outputs.count }}"
            echo "- Features → docs: $(cat /tmp/feature_docs_status)"
            echo "- Agent role consistency: $(cat /tmp/agent_roles_status)"
            echo "- CLAUDE.md age: $(cat /tmp/claude_md_age_status)"
            echo "- Spec drift: $(cat /tmp/spec_drift_status)"
            echo "- Decision register (incl. headers): $(cat /tmp/decision_register_status)"
            echo "- Decision doc anchors: $(cat /tmp/decision_doc_anchors_status)"
            echo "- Doc frontmatter: $(cat /tmp/doc_frontmatter_status)"
            echo "- Doc broken links: $(cat /tmp/doc_links_status)"
            echo "- Generated doc index: $(cat /tmp/doc_index_status)"
            echo ""
            echo "See the Quality and Security workflow runs for lint/type/coverage/security detail."
          } >> "$GITHUB_STEP_SUMMARY"
