# Docker Compose configuratie voor sandcastle agents
# Gebruik: docker compose -f docker-compose.sandcastle.yml up -d

services:
  # Hoofd applicatie (Agent Cockpit)
  claude-cockpit:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      # Alleen benodigde Claude bestanden mounten (niet de hele ~/.claude directory)
      - ~/.claude/settings.json:/root/.claude/settings.json:ro
      - ~/.claude/settings.local.json:/root/.claude/settings.local.json:ro
      - ~/.claude.json:/root/.claude.json:ro
      # Codex config alleen lezen
      - ~/.codex/config.toml:/root/.codex/config.toml:ro
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/claude_registry.db
      - KANBAN_DATABASE_URL=sqlite+aiosqlite:///./data/kanban.db
    # Security: resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    # Security: read-only root filesystem (data volumes zijn writable)
    read_only: true
    tmpfs:
      - /tmp:size=100M
    # Security: niet root draaien
    user: "root"  # Root nodig voor volume mounts, maar beperkt
    restart: unless-stopped
    # Security: security opties
    security_opt:
      - no-new-privileges:true
    # Security: alleen benodigde capabilities
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  # Sandcastle agent container template
  sandcastle-agent:
    image: sandcastle:local
    # Security: resource limits per agent
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    # Security: read-only filesystem voor agent (code wordt via volume gemount)
    read_only: true
    tmpfs:
      - /tmp:size=50M
      - /home/agent/.npm:size=100M
    # Security: niet root
    user: "agent"
    # Security: beperkte capabilities
    cap_drop:
      - ALL
    # Security: geen nieuwe privileges
    security_opt:
      - no-new-privileges:true
    # Security: netwerk isolatie (geen toegang tot andere containers)
    networks:
      - sandcastle-isolated
    # Security: geen IPC sharing
    ipc: "none"
    # Security: geen PID sharing
    pid: "none"
    restart: "no"  # Agents worden dynamisch gestart

# Geïsoleerd netwerk voor sandcastle agents
networks:
  sandcastle-isolated:
    driver: bridge
    internal: false  # Internet toegang nodig voor API calls
    ipam:
      config:
        - subnet: 172.28.0.0/16