[project]
name = "claude-code-registry-backend"
version = "1.3.0"
description = "Backend API for Claude Cockpit"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "alembic>=1.13.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "aiosqlite>=0.19.0",
    "tomlkit>=0.13.2",
    "mcp>=1.2.0",
    "bcrypt>=4.0.0",
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.11.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line-too-long — 300+ pre-existing violations, needs a wrapping pass; not in scope here
    "B904",   # raise-without-from-inside-except — 150+ call sites need case-by-case `from err`/`from None` review
    "E402",   # module-import-not-at-top-of-file — some files intentionally manipulate sys.path first
    "E702",   # multiple-statements-on-one-line-semicolon
    "SIM117", # multiple-with-statements
    "B017",   # assert-raises-exception
    "SIM102", # collapsible-if
    "SIM105", # suppressible-exception
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query()/etc. are meant to be called in argument
# defaults — that's how the framework's dependency injection works. Without
# this, B008 misflags every route handler that takes a dependency.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
]

[tool.ruff.lint.per-file-ignores]
# `BuildImageRequest()` as a route parameter default is FastAPI's default-body
# pattern, not a mutable-default-argument bug — B008 has no allowlist for
# locally-defined Pydantic models the way `extend-immutable-calls` covers
# fastapi.Depends()/Query()/etc.
"app/api/v1/sandcastle/router.py" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
